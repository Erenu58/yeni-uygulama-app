<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Hava Durumu Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .search-box button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-box button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        
        .favorites {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .favorite-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .favorite-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }
        
        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .city-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .weather-icon {
            font-size: 60px;
            margin: 15px 0;
        }
        
        .temperature {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }
        
        .weather-description {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .detail {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
        }
        
        .detail-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        
        .detail-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
        
        .forecast-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .forecast-section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .forecast-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .forecast-time {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .forecast-temp {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .forecast-desc {
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 50px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Hava Durumu Dashboard</h1>
            <p>Gerçek Zamanlı Hava Durumu Verileri</p>
        </header>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Şehir adı girin (örn: İstanbul, Ankara)..."
                onkeypress="if(event.key === 'Enter') searchCity()"
            >
            <button onclick="searchCity()">🔍 Ara</button>
        </div>
        
        <div class="favorites">
            <h3 style="grid-column: 1/-1; color: white; margin-bottom: 10px;">⭐ Favori Şehirler</h3>
            <button class="favorite-btn" onclick="searchCity('Istanbul')">İstanbul</button>
            <button class="favorite-btn" onclick="searchCity('Ankara')">Ankara</button>
            <button class="favorite-btn" onclick="searchCity('Izmir')">İzmir</button>
            <button class="favorite-btn" onclick="searchCity('Bursa')">Bursa</button>
            <button class="favorite-btn" onclick="searchCity('Antalya')">Antalya</button>
        </div>
        
        <div id="messageContainer"></div>
        
        <div class="weather-grid" id="weatherGrid"></div>
        
        <div class="forecast-section" id="forecastSection" style="display: none;">
            <h2>📅 5 Günlük Tahmin</h2>
            <div class="forecast-grid" id="forecastGrid"></div>
        </div>
        
        <footer>
            <p>🌍 OpenWeatherMap API tarafından sağlanan veriler</p>
            <p>💻 © 2026 Odin AI Weather Dashboard</p>
        </footer>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        function getWeatherEmoji(description) {
            const desc = description.toLowerCase();
            if (desc.includes('bulut') || desc.includes('cloud')) return '☁️';
            if (desc.includes('açık') || desc.includes('clear') || desc.includes('sunny')) return '☀️';
            if (desc.includes('yağmur') || desc.includes('rain')) return '🌧️';
            if (desc.includes('gök gürültü') || desc.includes('thunder')) return '⚡';
            if (desc.includes('kar') || desc.includes('snow')) return '❄️';
            if (desc.includes('sis') || desc.includes('mist') || desc.includes('fog')) return '🌫️';
            return '🌡️';
        }
        
        function searchCity(city = null) {
            const cityInput = document.getElementById('cityInput');
            const cityName = city || cityInput.value.trim();
            
            if (!cityName) {
                showMessage('Lütfen bir şehir adı girin', 'error');
                return;
            }
            
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
            
            fetch(`${API_BASE}/weather/${cityName}`)
                .then(response => response.json())
                .then(data => {
                    if (data.hata) {
                        showMessage('❌ ' + data.hata, 'error');
                        grid.innerHTML = '';
                    } else {
                        displayWeather(data);
                        loadForecast(cityName);
                        cityInput.value = '';
                    }
                })
                .catch(error => {
                    showMessage('Hata: ' + error.message, 'error');
                    grid.innerHTML = '';
                });
        }
        
        function displayWeather(data) {
            const grid = document.getElementById('weatherGrid');
            const emoji = getWeatherEmoji(data.açıklama);
            
            const card = `
                <div class="weather-card">
                    <div class="city-name">${data.şehir}, ${data.ülke}</div>
                    <div class="weather-icon">${emoji}</div>
                    <div class="temperature">${Math.round(data.sıcaklık)}°C</div>
                    <div class="weather-description">${data.açıklama}</div>
                    
                    <div class="weather-details">
                        <div class="detail">
                            <div class="detail-label">💧 Nem</div>
                            <div class="detail-value">${data.nem}%</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">💨 Rüzgar</div>
                            <div class="detail-value">${data.rüzgar_hızı} m/s</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">🌡️ Hissedilen</div>
                            <div class="detail-value">${Math.round(data.hissedilen)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">📊 Basınç</div>
                            <div class="detail-value">${data.basınç} hPa</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">🔥 Min</div>
                            <div class="detail-value">${Math.round(data.min_sıcaklık)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">❄️ Max</div>
                            <div class="detail-value">${Math.round(data.max_sıcaklık)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">☁️ Bulutluluk</div>
                            <div class="detail-value">${data.bulutluluk}%</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">👁️ Görüş</div>
                            <div class="detail-value">${Math.round(data.görüş_mesafesi / 1000)} km</div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px; text-align: center; color: #999; font-size: 12px;">
                        🕐 ${data.zaman}
                    </div>
                </div>
            `;
            
            grid.innerHTML = card;
        }
        
        function loadForecast(city) {
            fetch(`${API_BASE}/forecast/${city}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.hata) {
                        displayForecast(data);
                    }
                })
                .catch(error => console.log('Forecast hatası:', error));
        }
        
        function displayForecast(data) {
            const forecastSection = document.getElementById('forecastSection');
            const forecastGrid = document.getElementById('forecastGrid');
            
            let html = '';
            data.tahminler.forEach(forecast => {
                const emoji = getWeatherEmoji(forecast.açıklama);
                html += `
                    <div class="forecast-item">
                        <div class="forecast-time">${forecast.zaman}</div>
                        <div class="forecast-icon" style="font-size: 30px;">${emoji}</div>
                        <div class="forecast-temp">${Math.round(forecast.sıcaklık)}°C</div>
                        <div class="forecast-desc">${forecast.açıklama}</div>
                        <div style="font-size: 11px; margin-top: 8px;">💧 ${forecast.nem}% 🌧️ ${(forecast.yağış_olasılığı).toFixed(0)}%</div>
                    </div>
                `;
            });
            
            forecastGrid.innerHTML = html;
            forecastSection.style.display = 'block';
        }
        
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const className = type === 'error' ? 'error' : 'success';
            container.innerHTML = `<div class="${className}">${message}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Sayfa yüklendiğinde varsayılan şehri göster
        window.onload = () => {
            searchCity('Istanbul');
        };
    </script>
</body>
</html>
