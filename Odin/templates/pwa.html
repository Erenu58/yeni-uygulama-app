<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Odin Weather">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <title>🌤️ Hava Durumu Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: rgba(0, 0, 0, 0.1);
            color: white;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .online-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #51cf66;
            margin-right: 5px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .search-box button {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .city-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .weather-icon {
            font-size: 50px;
            margin: 10px 0;
        }
        
        .temperature {
            font-size: 40px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .weather-description {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .detail {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
        }
        
        .detail-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
        
        .forecast-section {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .forecast-section h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }
        
        .forecast-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
        }
        
        .forecast-temp {
            font-weight: bold;
            margin: 5px 0;
        }
        
        .nav-bottom {
            display: flex;
            justify-content: space-around;
            background: white;
            border-top: 1px solid #eee;
            padding: 10px 0;
            position: sticky;
            bottom: 0;
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #667eea;
            border-top: 3px solid #667eea;
        }
        
        .loading {
            text-align: center;
            color: white;
            padding: 20px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 20px;
        }
        
        .success {
            background: #51cf66;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
        }
        
        .map-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            height: 300px;
        }
        
        .alert-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        
        .alert-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 5px;
        }
        
        .alert-desc {
            font-size: 14px;
            color: #856404;
        }
        
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.2em;
            }
            
            .temperature {
                font-size: 32px;
            }
            
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🌤️ Odin Weather</h1>
            <div class="status-bar">
                <span><span class="online-indicator" id="onlineIndicator"></span><span id="onlineStatus">Online</span></span>
                <span id="currentTime"></span>
            </div>
        </header>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Şehir girin..."
                autocomplete="off"
            >
            <button onclick="searchCity()">🔍</button>
            <button onclick="getLocation()" title="Konumumu Kullan">📍</button>
        </div>
        
        <div class="content" id="content">
            <div class="loading">⏳ Yükleniyor...</div>
        </div>
        
        <nav class="nav-bottom">
            <button class="nav-item active" onclick="showTab('weather')">🌤️ Hava</button>
            <button class="nav-item" onclick="showTab('forecast')">📅 Tahmin</button>
            <button class="nav-item" onclick="showTab('map')">🗺️ Harita</button>
            <button class="nav-item" onclick="showTab('alerts')">⚠️ Uyarı</button>
            <button class="nav-item" onclick="showTab('settings')">⚙️ Ayar</button>
        </nav>
    </div>
    
    <script>
        // Service Worker Kayıt
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(reg => console.log('Service Worker kayıtlı'))
                .catch(err => console.log('Service Worker hatası:', err));
        }
        
        // Online/Offline Dinle
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        function updateOnlineStatus() {
            const indicator = document.getElementById('onlineIndicator');
            const status = document.getElementById('onlineStatus');
            
            if (navigator.onLine) {
                indicator.style.background = '#51cf66';
                status.textContent = 'Online';
            } else {
                indicator.style.background = '#ff6b6b';
                status.textContent = 'Offline';
            }
        }
        
        // Saati güncelle
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }, 1000);
        
        // Sayfa yüklendiğinde
        updateOnlineStatus();
        searchCity('Istanbul');
        
        async function searchCity(city = null) {
            const input = document.getElementById('cityInput');
            const cityName = city || input.value.trim();
            
            if (!cityName) return;
            
            try {
                const response = await fetch(`/api/weather/${cityName}`);
                const data = await response.json();
                
                if (data.hata) {
                    displayError(data.hata);
                } else {
                    displayWeather(data);
                    input.value = '';
                }
            } catch (error) {
                displayError('Hata: ' + error.message);
            }
        }
        
        function getLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const { latitude, longitude } = position.coords;
                    // Koordinatlardan şehir adını al (reverse geocoding)
                    try {
                        const response = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
                        );
                        const data = await response.json();
                        const city = data.address.city || data.address.town || data.address.village;
                        if (city) searchCity(city);
                    } catch (error) {
                        displayError('Konum alınamadı');
                    }
                });
            }
        }
        
        function displayWeather(data) {
            const content = document.getElementById('content');
            
            const emoji = getWeatherEmoji(data.açıklama);
            
            content.innerHTML = `
                <div class="weather-card">
                    <div class="city-name">${data.şehir}, ${data.ülke}</div>
                    <div class="weather-icon">${emoji}</div>
                    <div class="temperature">${Math.round(data.sıcaklık)}°C</div>
                    <div class="weather-description">${data.açıklama}</div>
                    
                    <div class="details-grid">
                        <div class="detail">
                            <div class="detail-label">💧 Nem</div>
                            <div class="detail-value">${data.nem}%</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">💨 Rüzgar</div>
                            <div class="detail-value">${data.rüzgar_hızı} m/s</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">🌡️ Hissedilen</div>
                            <div class="detail-value">${Math.round(data.hissedilen)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">📊 Basınç</div>
                            <div class="detail-value">${data.basınç} hPa</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">🔥 Min</div>
                            <div class="detail-value">${Math.round(data.min_sıcaklık)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">❄️ Max</div>
                            <div class="detail-value">${Math.round(data.max_sıcaklık)}°C</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function displayError(message) {
            document.getElementById('content').innerHTML = 
                `<div class="error">❌ ${message}</div>`;
        }
        
        function getWeatherEmoji(desc) {
            desc = desc.toLowerCase();
            if (desc.includes('bulut')) return '☁️';
            if (desc.includes('açık') || desc.includes('sunny')) return '☀️';
            if (desc.includes('yağmur')) return '🌧️';
            if (desc.includes('gök gürültü')) return '⛈️';
            if (desc.includes('kar')) return '❄️';
            if (desc.includes('sis')) return '🌫️';
            return '🌤️';
        }
        
        function showTab(tab) {
            // Tab sayfalarını değiştir
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
